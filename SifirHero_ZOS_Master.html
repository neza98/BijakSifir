<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sifir Hero — Coin & Rating</title>
<style>
:root{--bg:#07152e;--card:#122d59;--card2:#0a1e3e;--text:#fff;--muted:#b9c9e8;--yellow:#ffd83d;--green:#55e57d;--red:#ff6879;--blue:#50a9ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% 0,#2e5da5,#0a1c3c 42%,#040b18 100%)}button{font:inherit;cursor:pointer;border:0}.wrap{max-width:920px;margin:auto;padding:15px}
header{display:flex;align-items:center;justify-content:space-between;gap:9px}.logo{font-size:34px;font-weight:1000;line-height:.8;color:var(--yellow);text-shadow:0 4px #000}.logo span{display:block;color:#6be85c}.profile{display:flex;align-items:center;gap:8px}.avatar{width:57px;height:57px;border-radius:50%;object-fit:cover;object-position:50% 32%;border:3px solid var(--yellow);background:#17365f}.level{background:#10284f;border:1px solid #42689b;border-radius:15px;padding:7px 10px;text-align:right;font-size:13px}.xp{height:7px;background:#29446f;border-radius:99px;margin-top:4px;overflow:hidden}.xp div{height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--green))}
.screen{display:none}.screen.active{display:block}.card{margin-top:13px;padding:17px;border-radius:21px;background:linear-gradient(145deg,#163664ee,#091a36ee);border:1px solid #355b8e;box-shadow:0 12px 30px #0005}h2{margin:2px 0 8px}.muted{color:var(--muted)}.tables{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}.tables button{padding:14px 4px;border-radius:14px;background:#1a4176;color:#fff;border:2px solid #39679d;font-size:18px;font-weight:1000}.tables button.selected{outline:3px solid var(--yellow)}.tables .mix{background:linear-gradient(135deg,#8d42d9,#ed4e9d)}
.modes{display:flex;flex-wrap:wrap;gap:8px}.modes button{padding:11px 13px;border-radius:13px;background:#17365f;color:#fff;border:2px solid #355d90;font-weight:900}.modes button.selected{outline:3px solid var(--yellow)}.start{width:100%;margin-top:14px;padding:16px;border-radius:16px;background:linear-gradient(135deg,#ffd83d,#ff9c2d);color:#17213a;font-size:19px;font-weight:1000}.sound{position:fixed;right:12px;bottom:12px;z-index:10;padding:10px 12px;border-radius:13px;background:#17365f;color:#fff;border:2px solid #416b9f;font-weight:900}
.gamehead{display:flex;align-items:center;justify-content:space-between;gap:7px;font-weight:900}.timer{font-size:23px;color:var(--yellow)}.coin{color:var(--yellow);font-weight:1000}.lives{font-size:20px}.progress{height:9px;background:#29446f;border-radius:99px;overflow:hidden;margin:11px 0}.progress div{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));width:0}.question{font-size:clamp(43px,11vw,75px);font-weight:1000;text-align:center;margin:20px 0}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.answers button{padding:18px;border-radius:17px;background:#173b6b;color:#fff;border:2px solid #3b6699;font-size:27px;font-weight:1000}.answers button.correct{background:#218e52}.answers button.wrong{background:#a93b50}.feedback{text-align:center;min-height:35px;font-weight:1000;font-size:18px;margin-top:8px}.pop{animation:pop .3s ease}.shake{animation:shake .25s ease}@keyframes pop{0%{transform:scale(.85)}70%{transform:scale(1.08)}100%{transform:scale(1)}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.center{text-align:center}.big{font-size:62px;font-weight:1000;color:var(--yellow)}.resultcoins{font-size:25px;font-weight:1000;color:var(--yellow)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#071832;border-radius:15px;text-align:center;padding:11px}.stat b{display:block;color:var(--yellow);font-size:25px}.ratingBox{display:flex;align-items:center;justify-content:center;gap:15px;padding:15px;background:#071832;border-radius:17px;margin-top:12px}.ratingNum{font-size:42px;font-weight:1000}.up{color:var(--green)}.down{color:var(--red)}.neutral{color:var(--yellow)}.ratingBar{height:13px;background:#263f68;border-radius:99px;overflow:hidden;margin-top:8px}.ratingBar div{height:100%;background:linear-gradient(90deg,#ff6879,#ffd83d,#55e57d);width:50%}.chart{height:180px;display:flex;align-items:end;gap:8px;padding:10px 3px 25px}.bar{flex:1;min-height:4px;background:linear-gradient(#69e47c,#348ddd);border-radius:7px 7px 2px 2px;position:relative}.bar small{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}.trend{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:9px}.dot{width:11px;height:11px;border-radius:50%;background:#657a9c}.dot.good{background:var(--green)}.dot.bad{background:var(--red)}.ach{display:flex;gap:10px;align-items:center;background:#071832;border-radius:14px;padding:11px;margin:7px 0}.ach.lock{opacity:.4}.medal{font-size:29px}.nav{display:flex;gap:8px;margin:12px 0}.nav button{flex:1;padding:12px;border-radius:13px;background:#132f58;color:#d9e7ff;font-weight:900}.nav button.active{background:#2860a0;color:#fff}
@media(max-width:600px){.tables{grid-template-columns:repeat(4,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.answers button{font-size:24px}}

.profileScreen{max-width:760px;margin:0 auto}.profileGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.profileCard{background:#0b1d3a;border:2px solid #315783;border-radius:18px;padding:14px;text-align:center;color:#fff}.profileCard.active{outline:3px solid var(--yellow)}.profileAvatar{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid var(--yellow);margin:auto}.avatarChoices{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:12px}.avatarChoice{font-size:34px;padding:12px 4px;border-radius:16px;background:#17365f;border:2px solid #355d90}.avatarChoice.selected{outline:3px solid var(--yellow)}.nameInput{width:100%;padding:13px;border-radius:13px;border:2px solid #42689b;background:#071832;color:#fff;font-size:17px;margin-top:8px}.smallBtn{padding:10px 13px;border-radius:12px;background:#17365f;color:#fff;font-weight:900;margin-top:8px}.deleteBtn{background:#7c2e42}.topProfile{cursor:pointer}.profileLabel{font-weight:900}

</head>
<body>
<div class="wrap">
<header><div class="logo">SIFIR<span>HERO</span></div><div class="profile topProfile" onclick="showProfiles()"><img class="avatar" id="headAvatar"><div class="level"><span id="profileName" class="profileLabel">Pemain</span><br>⭐ Level <b id="level">1</b><br>🪙 <b id="coins">0</b><div class="xp"><div id="xpbar"></div></div><small id="xptext">0 / 100 XP</small></div></div></header>

<button class="sound" id="soundBtn" onclick="toggleSound()">🔊 Bunyi ON</button>


<section id="profileScreen" class="screen active profileScreen">
<div class="card">
<h2>👋 Siapa nak main?</h2>
<p class="muted">Setiap pemain ada coin, XP, rating dan pencapaian sendiri.</p>
<div class="profileGrid" id="profileGrid"></div>
<div class="card" style="margin-top:14px;background:#0b1d3a">
<h3 style="margin:0">➕ Tambah pemain</h3>
<input id="newName" class="nameInput" maxlength="16" placeholder="Nama pemain">
<div class="charGrid" id="avatarChoices"></div>
<button class="start" onclick="createProfile()">CREATE PROFILE 🚀</button>
</div>
</div>
</section>

<section id="home" class="screen">
<div class="card"><h2>🚀 Jom Kuasai Sifir!</h2><p><b id="welcomeName">Pemain</b> dah bersedia? <button class="smallBtn" onclick="showProfiles()">TUKAR PEMAIN</button></p><p class="muted">Jawab dengan tenang. Setiap jawapan betul beri coin + XP. Kumpul streak untuk bonus! 🔥</p><div class="tables" id="tables"></div></div>
<div class="card"><h2>🔓 Koleksi Watak ZOS</h2><p class="muted">Kumpul coin dengan jawab <b>betul dan pantas</b> untuk unlock watak.</p><div class="shopGrid" id="characterShop"></div></div>
<div class="card"><h2>⏱️ Pilih Mod</h2><div class="modes"><button class="selected" data-mode="10">🌱 10 Soalan</button><button data-mode="20">🔥 20 Soalan</button><button data-mode="120">🐢 2 Minit</button><button data-mode="180">🚶 3 Minit</button><button data-mode="300">🏃 5 Minit</button><button data-mode="60">⚡ 60 Saat</button></div><p class="muted">🌱 10 soalan tiada countdown — sesuai untuk mula belajar.</p><button class="start" onclick="startGame()">MULA PERMAINAN ▶</button></div>
</section>

<section id="game" class="screen"><div class="card"><div class="gamehead"><span id="gameMode">Sifir 2</span><span class="timer">⏱️ <span id="time">—</span></span><span class="coin">🪙 <span id="gameCoins">0</span></span><span class="lives" id="lives">❤️❤️❤️</span></div><div class="progress"><div id="prog"></div></div><div class="center"><div id="gameAvatarEmoji" style="font-size:58px"></div><img class="avatar" id="gameAvatar" style="width:78px;height:78px"><div class="question" id="question">2 × 3 = ?</div></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div></div></section>

<section id="result" class="screen"><div class="card center"><div id="resultAvatarEmoji" style="font-size:70px"></div><img class="avatar" id="resultAvatar" style="width:92px;height:92px"><h2>🎉 Misi Selesai!</h2><div class="big" id="resultScore">0 / 0</div><div class="resultcoins" id="resultCoins">🪙 +0</div><p id="resultMsg"></p><p class="muted" id="resultReview"></p><button class="start" onclick="show('home')">MAIN LAGI 🔁</button></div></section>

<section id="statsScreen" class="screen"><div class="card"><h2>📈 Pencapaian</h2><div class="stats"><div class="stat"><b id="totalQ">0</b>Soalan</div><div class="stat"><b id="accuracy">0%</b>Ketepatan</div><div class="stat"><b id="bestStreak">0</b>Streak Terbaik</div><div class="stat"><b id="bestTime">—</b>Masa terpantas</div></div>
<div class="ratingBox"><div><div class="ratingNum" id="rating">1000</div><div class="muted">⭐ Rating</div></div><div style="flex:1"><b id="ratingChange" class="neutral">—</b><div class="ratingBar"><div id="ratingFill"></div></div><small class="muted">Berdasarkan betul & salah</small></div></div>
<div class="trend" id="trend"></div></div>
<div class="card"><h2>📊 Ketepatan 7 Permainan</h2><div class="chart" id="chart"></div></div>
<div class="card"><h2>🏆 Achievement</h2><div id="achievements"></div></div></section>

<div class="nav"><button class="active" onclick="nav('home',this)">🏠 Utama</button><button onclick="nav('statsScreen',this)">📈 Prestasi</button></div>
</div>

let db=JSON.parse(localStorage.getItem(KEY)||'null')||{profiles:[],current:null};
let data=null;
let s={table:data.table||2,mode:10,q:0,score:0,streak:0,lives:3,start:0,timer:null,questions:[],coins:0};
let soundOn=true,audioCtx=null;

let selectedAvatar='🦸';
function defaultData(name,character){return {id:Date.now()+Math.random(),name,character,xp:0,coins:0,total:0,correct:0,bestStreak:0,bestTime:null,rating:1000,games:[],answers:[],mistakes:{},speedByKey:{},table:2}}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db))}
function charByName(name){return CHARACTERS.find(c=>c.name===name)||CHARACTERS[0]}
function isUnlocked(c){return c.cost===0 || (data && data.unlocked && data.unlocked.includes(c.name))}
function renderProfiles(){
 const g=document.getElementById('profileGrid');g.innerHTML='';
 db.profiles.forEach(p=>{
  const c=charByName(p.character);
  const d=document.createElement('div');d.className='profileCard'+(db.current===p.id?' active':'');
  d.innerHTML='<img class="profileAvatar" src="'+c.img+'"><div style="font-weight:1000;margin-top:6px">'+escapeHTML(p.name)+'</div><small>'+c.emoji+' '+c.name+'<br>⭐ '+p.rating+' · 🪙 '+p.coins+'</small><br><button class="smallBtn" onclick="selectProfile('+JSON.stringify(p.id)+')">MAIN</button><button class="smallBtn deleteBtn" onclick="deleteProfile('+JSON.stringify(p.id)+')">PADAM</button>';
  g.appendChild(d);
 });
 const ac=document.getElementById('avatarChoices');ac.innerHTML='';
 CHARACTERS.forEach(c=>{
   let b=document.createElement('button');b.className='charCard'+(selectedAvatar===c.name?' sel':'')+(isUnlocked(c)?'':' locked');
   b.innerHTML='<img class="charImg" src="'+c.img+'"><div class="charName">'+c.emoji+' '+escapeHTML(c.name)+'</div>'+(isUnlocked(c)?'':'<span class="lockBadge">🔒 '+c.cost+' 🪙</span>');
   b.onclick=()=>{if(!isUnlocked(c)){return}selectedAvatar=c.name;renderProfiles()};
   ac.appendChild(b)
 })
}
function showCharacterShop(){
 const box=document.getElementById('characterShop'); if(!box)return;
 box.innerHTML=CHARACTERS.filter(c=>c.cost>0).map(c=>{
   const u=isUnlocked(c);
   return '<div class="shopCard"><img class="charImg" src="'+c.img+'"><div class="charName">'+c.emoji+' '+escapeHTML(c.name)+'</div><div class="muted">'+(u?'✅ UNLOCKED':'🪙 '+c.cost)+'</div><button '+(u||data.coins<c.cost?'disabled':'')+' onclick="unlockCharacter('+JSON.stringify(c.name)+')">'+(u?'✓':'UNLOCK')+'</button></div>'
 }).join('')
}
function unlockCharacter(name){
 const c=charByName(name); if(!c||isUnlocked(c)||data.coins<c.cost)return;
 data.coins-=c.cost;data.unlocked=data.unlocked||[];data.unlocked.push(c.name);save();showCharacterShop();renderProfiles();
}
function createProfile(){
 let name=document.getElementById('newName').value.trim();
 if(!name){alert('Masukkan nama dulu 😊');return}
 let p=defaultData(name,selectedAvatar);p.unlocked=['ZOS'];db.profiles.push(p);db.current=p.id;data=p;saveDB();document.getElementById('newName').value='';refreshProfile();show('home');renderProfiles();
}
function selectProfile(id){let p=db.profiles.find(x=>x.id===id);if(!p)return;db.current=id;data=p;data.unlocked=data.unlocked||['ZOS'];data.character=charByName(data.character).name;saveDB();refreshProfile();show('home')}
function deleteProfile(id){if(!confirm('Padam profile ini? Semua pencapaian profile akan hilang.'))return;db.profiles=db.profiles.filter(x=>x.id!==id);if(db.current===id){db.current=db.profiles[0]?.id||null;data=db.profiles[0]||null}saveDB();renderProfiles();if(data){refreshProfile();show('home')}}
function showProfiles(){renderProfiles();show('profileScreen')}
function refreshProfile(){if(!data)return;data.unlocked=data.unlocked||['ZOS'];profileName.textContent=data.name;header();setupPhotos();showCharacterShop()}
if(!db.profiles.length){let p=defaultData('Pemain 1','ZOS');p.unlocked=['ZOS'];db.profiles.push(p);db.current=p.id;data=p;saveDB()}else{data=db.profiles.find(x=>x.id===db.current)||db.profiles[0];db.current=data.id;data.unlocked=data.unlocked||['ZOS'];if(!CHARACTERS.some(c=>c.name===data.character))data.character='ZOS'}

function setupPhotos(){if(!data)return;let c=charByName(data.character);['headAvatar','gameAvatar','resultAvatar'].forEach(id=>{let e=document.getElementById(id);if(e){e.src=c.img;e.style.display='block'}});if(typeof gameAvatarEmoji!=='undefined')gameAvatarEmoji.textContent='';if(typeof resultAvatarEmoji!=='undefined')resultAvatarEmoji.textContent='';}
function audio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function tone(f,d,t='sine',v=.045,delay=0){if(!soundOn)return;let c=audio(),o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(0,c.currentTime+delay);g.gain.linearRampToValueAtTime(v,c.currentTime+delay+.01);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+delay+d);o.connect(g);g.connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+d+.03)}
function goodSound(){tone(660,.08,'triangle',.06);tone(880,.1,'triangle',.055,.07);tone(1046,.16,'triangle',.05,.15)}
function badSound(){tone(180,.15,'sawtooth',.035);tone(130,.18,'sawtooth',.025,.08)}
function bonusSound(){tone(523,.09,'triangle',.06);tone(659,.09,'triangle',.06,.1);tone(784,.18,'triangle',.06,.2)}
function finishSound(){[523,659,784,1046].forEach((f,i)=>tone(f,.14,'triangle',.06,i*.1))}
function toggleSound(){soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊 Bunyi ON':'🔇 Bunyi OFF';if(soundOn)tone(660,.1,'triangle',.05)}
function save(){let i=db.profiles.findIndex(p=>p.id===data.id);if(i>=0)db.profiles[i]=data;db.current=data.id;saveDB();header()}
function header(){if(!data)return;let lv=Math.floor(data.xp/100)+1,x=data.xp%100,c=charByName(data.character);level.textContent=lv;coins.textContent=data.coins;xpbar.style.width=x+'%';xptext.textContent=x+' / 100 XP';profileName.textContent=data.name;welcomeName.textContent=data.name}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='statsScreen')stats()}
function nav(id,b){show(id);document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
function selectTable(n,b){s.table=n;data.table=n;document.querySelectorAll('#tables button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');save()}
function makeTables(){for(let i=2;i<=12;i++){let b=document.createElement('button');b.textContent=i+' ×';b.onclick=()=>selectTable(i,b);tables.appendChild(b)}let b=document.createElement('button');b.textContent='❓ Campuran';b.className='mix';b.onclick=()=>selectTable(0,b);tables.appendChild(b);let idx=s.table?s.table-2:11;if(tables.children[idx])tables.children[idx].classList.add('selected')}
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.modes button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');s.mode=+b.dataset.mode})
function makeQuestions(n){let a=[];for(let i=0;i<n;i++){let pool=[];for(let t=2;t<=12;t++)for(let x=1;x<=12;x++){if(s.table&&t!==s.table)continue;let k=t+'x'+x, m=(data.mistakes||{})[k]||0;pool.push({t,x,ans:t*x,w:1+m*3})}let total=pool.reduce((z,q)=>z+q.w,0),r=Math.random()*total,q=pool[0];for(let item of pool){r-=item.w;if(r<=0){q=item;break}}a.push(q)}return a}
function startGame(){s.q=0;s.score=0;s.streak=0;s.lives=3;s.coins=0;s.start=Date.now();s.questions=makeQuestions(s.mode>=60?100:s.mode);show('game');gameMode.textContent=s.table?'Sifir '+s.table:'Campuran';clearInterval(s.timer);s.timer=setInterval(tick,250);render()}
function tick(){let e=Math.floor((Date.now()-s.start)/1000);if(s.mode>=60){let left=Math.max(0,s.mode-e);time.textContent=left+'s';prog.style.width=Math.min(100,e/s.mode*100)+'%';if(left<=0)finish('Masa tamat!')}else time.textContent=Math.floor(e/60)+':'+String(e%60).padStart(2,'0')}
function render(){if(s.mode<60&&s.q>=s.questions.length)return finish();let q=s.questions[s.q];s.questionStart=Date.now();question.textContent=q.t+' × '+q.x+' = ?';if(s.mode<60)prog.style.width=s.q/s.questions.length*100+'%';lives.textContent='❤️'.repeat(s.lives)+'🖤'.repeat(3-s.lives);gameCoins.textContent=s.coins;feedback.textContent='';let opts=new Set([q.ans]);while(opts.size<4)opts.add(Math.max(1,q.ans+Math.floor(Math.random()*25)-12));answers.innerHTML='';[...opts].sort(()=>Math.random()-.5).forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>answer(v,b);answers.appendChild(b)})}
function coinForSeconds(sec,ok){
 if(!ok)return 0;
 if(sec<3)return 25;
 if(sec<5)return 15;
 if(sec<=10)return 10;
 return 5;
}
function answer(v,b){
 let q=s.questions[s.q],ok=v===q.ans;
 document.querySelectorAll('.answers button').forEach(x=>x.disabled=true);
 let sec=Math.max(.2,(Date.now()-(s.questionStart||Date.now()))/1000);
 let key=q.t+'x'+q.x;
 data.answers.push(ok?1:0);if(data.answers.length>100)data.answers.shift();
 data.mistakes=data.mistakes||{};data.speedByKey=data.speedByKey||{};
 if(!data.speedByKey[key])data.speedByKey[key]=[];data.speedByKey[key].push(sec);if(data.speedByKey[key].length>10)data.speedByKey[key].shift();
 if(ok){
   b.classList.add('correct','pop');s.score++;s.streak++;data.correct++;data.xp+=10;
   data.mistakes[key]=Math.max(0,(data.mistakes[key]||0)-1);
   let base=coinForSeconds(sec,true), bonus=(s.streak>=3?5:0)+(s.streak>=5?10:0)+(s.streak>=10?20:0),gain=base+bonus;
   s.coins+=gain;data.coins+=gain;
   feedback.innerHTML='✨ BETUL! <span class="speedReward">'+sec.toFixed(1)+'s · +'+gain+' 🪙</span>'+(s.streak>=3?' 🔥 STREAK '+s.streak:'');
   goodSound();if(s.streak===3||s.streak===5||s.streak===10)bonusSound()
 }else{
   b.classList.add('wrong','shake');s.streak=0;s.lives--;data.xp+=2;
   data.mistakes[key]=(data.mistakes[key]||0)+1;
   feedback.innerHTML='💡 Jawapan: '+q.ans+' · '+sec.toFixed(1)+'s';
   badSound()
 }
 data.total++;let delta=ok?8:-10;data.rating=Math.max(0,data.rating+delta);data.bestStreak=Math.max(data.bestStreak,s.streak);save();
 setTimeout(()=>{if(s.lives<=0)return finish('Nyawa habis!');s.q++;render()},650)
}
function finish(reason=''){clearInterval(s.timer);finishSound();let e=Math.round((Date.now()-s.start)/1000);if(!data.bestTime||e<data.bestTime)data.bestTime=e;let acc=s.q?Math.round(s.score/s.q*100):0;data.games.push({score:s.score,total:s.q,acc,rating:data.rating});data.games=data.games.slice(-7);save();resultScore.textContent=s.score+' / '+s.q;resultCoins.textContent='🪙 +'+s.coins;resultMsg.textContent=reason||(acc===100?'🏆 PERFECT!':acc>=80?'🔥 Hebat! Makin power!':'💪 Tak apa, cuba lagi!');resultReview.textContent='Ketepatan: '+acc+'% • Rating sekarang: '+data.rating+' • Streak terbaik: '+data.bestStreak;show('result')}
function stats(){totalQ.textContent=data.total;accuracy.textContent=(data.total?Math.round(data.correct/data.total*100):0)+'%';bestStreak.textContent=data.bestStreak;bestTime.textContent=data.bestTime?data.bestTime+'s':'—';rating.textContent=data.rating;let last=data.games.length>1?data.games[data.games.length-2].rating:null;let diff=last===null?0:data.rating-last;ratingChange.textContent=last===null?'⭐ Rating permulaan':(diff>0?'▲ +'+diff+' naik':diff<0?'▼ '+diff+' turun':'— Tiada perubahan');ratingChange.className=diff>0?'up':diff<0?'down':'neutral';ratingFill.style.width=Math.min(100,Math.max(0,(data.rating-500)/10))+'%';trend.innerHTML='';data.answers.slice(-30).forEach(x=>{let d=document.createElement('span');d.className='dot '+(x?'good':'bad');trend.appendChild(d)});chart.innerHTML='';data.games.forEach(g=>{let b=document.createElement('div');b.className='bar';b.style.height=Math.max(5,g.acc)+'%';b.innerHTML='<small>'+g.acc+'%</small>';chart.appendChild(b)});if(!data.games.length)chart.innerHTML='<span class="muted">Belum ada rekod. Jom mula! 🚀</span>';let a=[['🥉','Langkah Pertama',data.total>=1],['🥈','Sifir Rookie',data.total>=10],['🎯','Perfect!',data.games.some(g=>g.acc===100)],['🔥','Streak Master',data.bestStreak>=10],['🏆','Sifir Legend',data.total>=100]];achievements.innerHTML='';a.forEach(x=>{let d=document.createElement('div');d.className='ach '+(x[2]?'':'lock');d.innerHTML='<span class="medal">'+x[0]+'</span><div><b>'+x[1]+'</b></div>';achievements.appendChild(d)})}
s.mode=10;makeTables();renderProfiles();refreshProfile();show('home');
</script>
</body>
